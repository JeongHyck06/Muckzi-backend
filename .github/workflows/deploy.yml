name: Deploy backend to home server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muckzi-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/home-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/home-deploy ~/.ssh/known_hosts

      - name: Upload source and deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '2222' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'jack' }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          test -n "$KAKAO_REST_KEY"
          printf 'KAKAO_REST_KEY=%s\n' "$KAKAO_REST_KEY" | ssh -i ~/.ssh/home-deploy -o BatchMode=yes -o IdentitiesOnly=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p ~/apps/muckzi; umask 077; cat > ~/apps/muckzi/backend.env'
          git archive HEAD | ssh -i ~/.ssh/home-deploy -o BatchMode=yes -o IdentitiesOnly=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e; cd ~/apps/muckzi; rm -rf backend; mkdir backend; tar -x -C backend; backend/deploy.sh'

      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/home-deploy ~/.ssh/known_hosts
