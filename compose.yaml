name: muckzi-backend
services:
  backend:
    build: .
    image: muckzi-backend
    container_name: muckzi-backend
    restart: unless-stopped
    ports: ["127.0.0.1:18090:8080"]
    env_file: ../backend.env
    environment:
      AI_URL: http://muckzi-ai:8000
      TZ: Asia/Seoul
    networks: [muckzi]
    mem_limit: 1g
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
networks:
  muckzi: {external: true}
